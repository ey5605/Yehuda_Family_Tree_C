name: Deploy family tree
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: production
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      D1_DATABASE_ID: ${{ vars.D1_DATABASE_ID }}
      R2_BUCKET_NAME: ${{ vars.R2_BUCKET_NAME }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm test && npm run typecheck && npm run build
      - run: node scripts/prepare-deploy.mjs
      - run: npx wrangler d1 migrations apply DB --remote --config dist/server/wrangler.json
      - run: npx wrangler deploy --config dist/server/wrangler.json
      - name: Configure family authentication
        env:
          VIEW_PASSWORD_HASH: ${{ secrets.VIEW_PASSWORD_HASH }}
          EDIT_PASSWORD_HASH: ${{ secrets.EDIT_PASSWORD_HASH }}
          SESSION_SECRET: ${{ secrets.SESSION_SECRET }}
        run: |
          node --input-type=module -e 'import fs from "node:fs"; const s=Object.fromEntries(["VIEW_PASSWORD_HASH","EDIT_PASSWORD_HASH","SESSION_SECRET"].map(k=>{if(!process.env[k])throw Error("Missing secret: "+k);return [k,process.env[k]]}));fs.writeFileSync(".secrets.deploy.json",JSON.stringify(s),{mode:0o600})'
          npx wrangler secret bulk .secrets.deploy.json --config dist/server/wrangler.json
      - name: Remove temporary secret file
        if: always()
        run: rm -f .secrets.deploy.json
